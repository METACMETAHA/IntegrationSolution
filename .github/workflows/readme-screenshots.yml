name: README screenshots

# Re-captures docs/screenshots/*.png from the running application and commits them.
# - On a pull request: add the "update-screenshots" label (remove and re-add it to run again).
# - On any branch, once this file is on the default branch: run it manually (workflow_dispatch).
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}

jobs:
  capture:
    name: Capture and commit screenshots
    # Only for branches of this repository: fork pull requests get a read-only token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.label.name == 'update-screenshots' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}

      - name: Build
        uses: ./.github/actions/build-solution
        with:
          configuration: Release

      - name: Capture screenshots
        shell: powershell
        run: ./build/Capture-ReadmeScreenshots.ps1 -AppPath IntegrationSolution.ShellGUI\bin\Release\IntegrationSolution.ShellGUI.exe -OutputDirectory docs\screenshots -DumpAutomationTree

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-screenshots
          path: docs/screenshots
          if-no-files-found: ignore

      - name: Commit screenshots
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Screenshots are unchanged.'
            exit 0
          }
          git commit -m 'Update README screenshots'
          git push origin "HEAD:$env:BRANCH"
