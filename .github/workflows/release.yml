name: Release

# Push a tag such as v0.1.0, or run this workflow from the Actions tab with a tag name, to build the app and the
# MSI installer and attach them to a GitHub release. A manual run creates the tag on the commit it runs on.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to create and release, such as v0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CONFIGURATION: Release
      FLEETAUDIT_ROOT: ${{ github.workspace }}
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7

      - name: Build
        uses: ./.github/actions/build-solution
        with:
          configuration: ${{ env.CONFIGURATION }}

      # The tag (v1.2.3) becomes the MSI ProductVersion; a new ProductCode lets each release upgrade the previous one.
      - name: Stamp the installer version
        shell: pwsh
        run: ./build/Set-InstallerVersion.ps1 -Version $env:TAG

      - name: Build the installer
        shell: pwsh
        run: ./build/Build-Installer.ps1 -Configuration $env:CONFIGURATION

      # A broken installer must not be published.
      - name: Install, smoke test, uninstall
        shell: powershell
        run: ./build/Test-Installer.ps1 -MsiPath "FleetAudit.Installer\$env:CONFIGURATION\FleetAudit.Installer.msi" -ReferenceDirectory "FleetAudit.App\bin\$env:CONFIGURATION"

      - name: Upload installer logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-logs
          path: |
            artifacts/installer
            artifacts/logs
          if-no-files-found: ignore

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "sap-wialon-fleet-audit-$env:TAG-win.zip"
          Compress-Archive -Path "FleetAudit.App\bin\$env:CONFIGURATION\*" -DestinationPath $zip
          $msi = "sap-wialon-fleet-audit-$env:TAG-win-x86.msi"
          Copy-Item "FleetAudit.Installer\$env:CONFIGURATION\FleetAudit.Installer.msi" $msi
          gh release create $env:TAG $zip $msi --title $env:TAG --generate-notes --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
