version: 2
updates:
  - package-ecosystem: nuget
    directories:
      - "/*"
    schedule:
      interval: weekly
    # Patch updates come as one pull request. Minor updates (e.g. MahApps.Metro, Prism, Unity) come one package
    # per pull request, covering every project that uses it, so a breaking one can be reviewed or declined on its own.
    groups:
      nuget-patch:
        update-types: [patch]
      nuget-minor:
        update-types: [minor]
        group-by: dependency-name
    ignore:
      # Major versions of these change the API or the license (EPPlus 5+ is not free for commercial use).
      - dependency-name: EPPlus
        update-types: ["version-update:semver-major"]
      - dependency-name: Prism.*
        update-types: ["version-update:semver-major"]
      - dependency-name: Unity
        update-types: ["version-update:semver-major"]
      - dependency-name: MahApps.Metro*
        update-types: ["version-update:semver-major"]
      - dependency-name: LiveCharts*
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
