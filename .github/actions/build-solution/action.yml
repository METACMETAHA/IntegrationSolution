name: Build solution
description: Restores NuGet packages and builds FleetAudit.sln with MSBuild.

inputs:
  configuration:
    description: Build configuration.
    default: Release

runs:
  using: composite
  steps:
    - uses: microsoft/setup-msbuild@v2

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: packages
        key: nuget-${{ hashFiles('**/packages.config') }}
        restore-keys: nuget-

    - name: Restore NuGet packages
      shell: pwsh
      run: nuget restore FleetAudit.sln -NonInteractive

    # The .vdproj installer is skipped by MSBuild (MSB4078); build/Build-Installer.ps1 builds it with Visual Studio.
    - name: Build
      shell: pwsh
      run: msbuild FleetAudit.sln -m -nologo -verbosity:minimal "-p:Configuration=${{ inputs.configuration }}" "-bl:artifacts/logs/build.binlog"
